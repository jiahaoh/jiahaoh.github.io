name: Axe accessibility testing

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Detect Chrome version 🌐
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          CHROMIUM_VERSION=$("$CHROME_BIN" --version | grep -Eo '[0-9]+' | head -n1)
          echo "Chrome binary: $CHROME_BIN"
          echo "Chrome version: $("$CHROME_BIN" --version)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Install chromedriver 🚗
        run: |
          echo "Installing ChromeDriver major version: $CHROMIUM_VERSION"
          npm install -g chromedriver@$CHROMIUM_VERSION
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          npm install -g @axe-core/cli
          python3 -m http.server 8080 --directory _site &
          server_pid=$!
          trap "kill $server_pid" EXIT
          axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" "http://localhost:8080/${{ github.event.inputs.url || env.URL }}" --load-delay=1500 --exit
